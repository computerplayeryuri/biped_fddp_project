interpretation_guardrails:
- Do not claim walking-gait phase synchronisation from this double-support validation.
- The C2 layer is ready to use scheduled contact transitions when a walking/contact-switching
  FDDP reference is added.
- For the present CoM-shift references, C2 mainly validates sensor monitoring and
  compatibility with C1, not a new performance gain.
