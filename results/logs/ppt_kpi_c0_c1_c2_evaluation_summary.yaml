stage: PPT_KPI_C0_C1_C2_controller_evaluation
ppt_kpi_source: Presentation.pptx slides 13-18 and 22
scope_note: Current FDDP reference is double-support CoM shift, not walking. Walking
  velocity, step length, ZMP margin, CoT and battery voltage KPIs are defined for
  future tests but are not fully measurable from the current logs.
tested_kpi_families:
  stability:
  - fall flag
  - min contacts
  - peak/RMS pitch error
  - settling time
  tracking:
  - pitch tracking IAE
  - final pitch error
  - joint correction magnitude
  real_time:
  - QP solve time
  - deadline miss rate
  - 50 Hz update
  effort:
  - alpha RMS
  - squared alpha
  - max joint correction
  robustness:
  - matched forward/backward pitch disturbance
  - C2 contact timing demo
  hardware_feasibility:
  - runtime loadability
  - finite q_cmd
  - joint-limit check
  - rate limiting
not_yet_measured_from_current_project_state:
- walking duration over 10/30/60 s
- forward velocity error and step-length error from a walking gait
- ZMP margin from force/CoP estimation
- mechanical CoT from torque or current logs
- battery voltage drop and real servo fault events
- real hardware success rate
