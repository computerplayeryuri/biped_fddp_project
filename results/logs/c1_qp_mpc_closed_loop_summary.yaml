stage: C1_fixed_phase_reduced_order_QP_MPC_closed_loop_MuJoCo
purpose: Compare C0 FDDP-reference-only replay against C1 fixed-phase reduced-order
  QP-MPC position correction under identical root-pitch disturbance.
scope_note: QP-MPC is the high-frequency online correction layer. Full nonlinear FDDP
  remains the offline nominal trajectory generator. C2 contact-event phase synchronisation
  is not active.
architecture:
  nominal_reference: C0 FDDP q_ref/dq_ref/state_ref
  online_state:
  - root_pitch
  - root_pitch_rate
  qp_output: alpha_0
  joint_position_command: q_cmd = q_ref + G_correction * alpha_0
  qp_update_period_s: 0.02
  qp_prediction_horizon_s: 0.2
  joint_distribution_G_rad_per_rad:
  - 0.27
  - 0.062
  - -0.228
  - 0.27
  - 0.062
  - -0.228
reduced_pitch_model:
  state: '[pitch_error_rad, pitch_rate_error_rad_s]'
  A:
  - - 1.0
    - 0.02
  - - 0.0
    - 0.85
  B:
  - - 0.0
  - - -0.24
  note: Local reduced-order prediction model for the online QP correction; full nonlinear
    contact dynamics are retained in the offline FDDP trajectory.
disturbance:
  time_s: 0.4
  root_pitch_deg: 2.0
  root_pitch_rate_rad_s: 0.25
