          plus_pitch_change_deg: -0.2851896473513848
          minus_pitch_change_deg: 0.25908777488732776
    integrity:
      baseline_min_contacts: 8
      plus_min_contacts: 8
      minus_min_contacts: 4
      finite_authority: true
