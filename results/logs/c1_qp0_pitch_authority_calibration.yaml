stage: C1_QP0_MuJoCo_pitch_authority_and_reference_alignment
purpose: Identify the signed root-pitch response to the FDDP-guided joint correction
  distribution and export the C0 MuJoCo nominal baseline.
directions:
  forward:
    direction: forward
    reference: /home/zhijian/biped_fddp_project/transfer/trajectories/com_shift_forward_ref.npz
    baseline_alignment:
      baseline_root_pitch_at_pulse_rad: -0.01814884701274606
      baseline_root_pitch_at_pulse_deg: -1.039852336858961
      baseline_root_pitch_rate_at_pulse_rad_s: -0.26694118244607545
      note: This C0 MuJoCo baseline trajectory, rather than the raw Pinocchio free-flyer
        pitch, must be used as the fixed-phase pitch reference for the MuJoCo QP-MPC
        validation.
    pulse:
      start_time_s: 0.4
      duration_s: 0.1
      alpha_pulse_deg: 2.0
      joint_distribution_G_rad_per_rad:
      - 0.27
      - 0.062
      - -0.228
      - 0.27
      - 0.062
      - -0.228
    identified_authority:
      peak_signed_authority_rad_per_rad: -0.13927941827025836
      peak_response_time_s: 0.6480000000000005
      sign_of_positive_alpha_effect: -1
      recommended_alpha_sign_for_positive_pitch_error: 1
      recommendation: Positive alpha decreases measured root pitch; use positive alpha
        for a positive pitch error.
      probe_values:
        40ms:
          time_s: 0.44
          signed_pitch_authority_rad_per_rad: -0.027080514220076984
          plus_pitch_change_deg: -0.054161037854110194
          minus_pitch_change_deg: 0.05416101902619774
        80ms:
          time_s: 0.48000000000000004
          signed_pitch_authority_rad_per_rad: -0.026373980562214298
          plus_pitch_change_deg: -0.05274700149330324
          minus_pitch_change_deg: 0.05274892075555395
        120ms:
